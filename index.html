		<title>Frontend Mentor | Time tracking dashboard</title>

	<body>

			<div class="container">
				<section class="dashboard">
					<h1 class="sr-only">Time tracking dashboard</h1>

					<article class="profileCard">
						<div class="profileCard__top">
							<figure>
								<img src="./images/image-jeremy.png" alt="Profile image of Jeremy Robson" class="img-fluid" />

								<figcaption>
									<span>Report for</span>
									<strong>Jeremy Robson</strong>
								</figcaption>
							</figure>
						</div>
						<div class="profileCard__bottom">
							<ul>
								<li>
									<button type="button">Daily</button>
								</li>
								<li>
									<button type="button">Weekly</button>
								</li>
								<li>
									<button type="button">Monthly</button>
								</li>
							</ul>
						</div>
					</article>

					<article class="card">
						<div class="card__image" aria-hidden="true"></div>
						<div class="card__content">
							<div class="card__content-title">
								<h3>Work</h3>
								<button type="button">
									<svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
										<path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z" fill="#BBC0FF" fill-rule="evenodd" />
									</svg>
								</button>
							</div>

							<div class="card__content-hours">
								<strong>32hrs</strong>

						</div>
