<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
		<link rel="stylesheet" href="./styles/main.css" />

		<script defer src="./index.js"></script>

		<title>Frontend Mentor | Time tracking dashboard</title>
	</head>
	<body>
		<main>
			<div class="container">
				<section class="dashboard">
					<h1 class="sr-only">Time tracking dashboard</h1>

					<aside class="profileCard">
						<div class="profileCard__top">
							<figure>
								<img src="./images/image-jeremy.png" alt="Profile image of Jeremy Robson" class="img-fluid" />

								<figcaption>
									<span>Report for</span>
									<strong>Jeremy Robson</strong>
								</figcaption>
							</figure>
						</div>
						<div class="profileCard__bottom">
							<ul>
								<li>
									<button type="button" id="daily">Daily</button>
								</li>
								<li>
									<button type="button" id="weekly">Weekly</button>
								</li>
								<li>
									<button type="button" id="monthly">Monthly</button>
								</li>
							</ul>
						</div>
					</aside>

					<div class="dashboard__wrapper"></div>
				</section>
			</div>
		</main>

		<footer>
			<p>
				Challenge by
				<a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer" aria-label="Frontend Mentor (opens in a new tab)">Frontend Mentor </a>. Coded by
				<a href="#">João Rodrigues</a>.
			</p>
		</footer>
	</body>
</html>
